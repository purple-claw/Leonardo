<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leonardo Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header class="hero">
        <div class="container">
            <div class="hero-inner">
                <div class="hero-brand">
                    <span class="hero-kicker">Leonardo</span>
                    <h1 id="main-title">Problem notebooks, stripped down.</h1>
                    <p class="hero-subtitle">A black-and-white workspace to read, filter, and revise solutions without noise.</p>
                </div>
                <div class="hero-actions">
                    <button id="toggle-editor" class="btn ghost" type="button">Add Markdown</button>
                    <button id="theme-toggle" class="btn ghost theme-toggle" type="button">Dark mode</button>
                </div>
            </div>
        </div>
    </header>

    <main class="container layout">
        <aside class="sidebar">
            <div class="panel search-panel">
                <label class="panel-label" for="search-input">Search</label>
                <input type="text" id="search-input" class="input" placeholder="Title, number, tag">
            </div>

            <div class="panel">
                <div class="panel-title">Smart Filters</div>
                <div class="chip-group" id="smart-filters">
                    <button class="chip is-active" type="button" data-smart="all">All</button>
                    <button class="chip" type="button" data-smart="recent">Recent 30d</button>
                    <button class="chip" type="button" data-smart="has_answer">Has Answer</button>
                    <button class="chip" type="button" data-smart="needs_answer">Needs Answer</button>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">Difficulty</div>
                <div class="chip-group" id="difficulty-chips">
                    <button class="chip is-active" type="button" data-difficulty="All">All</button>
                    <button class="chip" type="button" data-difficulty="Easy">Easy</button>
                    <button class="chip" type="button" data-difficulty="Medium">Medium</button>
                    <button class="chip" type="button" data-difficulty="Hard">Hard</button>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">Categories</div>
                <div class="category-list" id="category-list"></div>
            </div>
        </aside>

        <section class="content">
            <div class="toolbar">
                <div class="stats-bar" id="stats-bar">
                    <div class="stat-card">
                        <div class="stat-value" id="stat-total">0</div>
                        <div class="stat-label">Total</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="stat-easy">0</div>
                        <div class="stat-label">Easy</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="stat-medium">0</div>
                        <div class="stat-label">Medium</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="stat-hard">0</div>
                        <div class="stat-label">Hard</div>
                    </div>
                </div>

                <div class="toolbar-row">
                    <div class="active-filters" id="active-filters"></div>
                    <div class="toolbar-actions">
                        <label class="select-label">
                            <span>Tag</span>
                            <select id="tag-filter" class="select">
                                <option value="">All tags</option>
                            </select>
                        </label>
                        <label class="select-label">
                            <span>Sort</span>
                            <select id="sort-select" class="select">
                                <option value="number_asc">Number asc</option>
                                <option value="number_desc">Number desc</option>
                                <option value="difficulty_asc">Difficulty asc</option>
                                <option value="difficulty_desc">Difficulty desc</option>
                                <option value="date_desc">Date desc</option>
                            </select>
                        </label>
                    </div>
                </div>
            </div>

            <div id="status-message" class="status-message" style="display: none;"></div>

            <div id="problems-container"></div>

            <div class="pagination" id="pagination" style="display: none;">
                <button id="prev-btn" class="btn ghost" type="button">Prev</button>
                <span id="page-info" class="page-info"></span>
                <button id="next-btn" class="btn ghost" type="button">Next</button>
            </div>
        </section>
    </main>

    <div id="editor-screen" class="editor-screen" aria-hidden="true">
        <div class="editor-shell" role="dialog" aria-modal="true" aria-labelledby="editor-mode-label">
            <div class="editor-toolbar">
                <div class="editor-meta">
                    <div class="editor-mode" id="editor-mode-label">Add Markdown</div>
                    <div class="editor-subtitle" id="editor-subtitle">Create a new problem entry.</div>
                </div>
                <button id="editor-close" class="btn ghost" type="button">Close</button>
            </div>
            <div class="editor-form">
                <label class="panel-label" for="editor-filename">Filename</label>
                <input type="text" id="editor-filename" class="input" placeholder="Optional filename (e.g. 0001-two-sum.md)">
                <label class="panel-label" for="markdown-editor">Markdown</label>
                <textarea id="markdown-editor" class="markdown-editor" placeholder="Paste markdown content here..."></textarea>
            </div>
            <div class="editor-footer">
                <button id="editor-clear" class="btn ghost" type="button">Clear</button>
                <button id="editor-save" class="btn" type="button">Save Markdown</button>
            </div>
        </div>
    </div>

    <div id="loading" class="loading" style="display: none;">
        <div class="spinner"></div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
