<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Viewer - Leonardo</title>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --font-sans: 'Inter', 'Instrument Sans', 'Segoe UI', 'Helvetica', sans-serif;
      --font-mono: 'JetBrains Mono', 'IBM Plex Mono', monospace;
      --bg: #050505; --surface: #0a0a0a; --border: #1a1a1a;
    }
    body { font-family: var(--font-sans); background: var(--bg); overflow: hidden; }
    .bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.5rem 1rem; border-bottom: 1px solid var(--border);
      background: var(--surface); color: #f5f5f5; height: 48px;
      gap: 8px;
    }
    .bar a {
      color: #aaa; text-decoration: none; font-size: 0.78rem; font-weight: 600;
      font-family: var(--font-mono); white-space: nowrap;
    }
    .bar a:hover { color: #ff5a00; }
    .bar h3 {
      font-size: 0.85rem; font-weight: 600;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      flex: 1; text-align: center;
    }
    iframe { width: 100%; height: calc(100vh - 48px); border: none; background: #fff; display: block; }
    @media (max-width: 600px) {
      .bar { padding: 0.4rem 0.75rem; height: 44px; }
      .bar a { font-size: 0.72rem; }
      .bar h3 { font-size: 0.78rem; }
      iframe { height: calc(100vh - 44px); }
    }
  </style>
</head>
<body>
  <div class="bar">
    <a href="/">&larr; Back</a>
    <h3 id="title">Artifact</h3>
    <a id="raw-link" href="#" target="_blank">Open raw</a>
  </div>
  <iframe id="viewer" sandbox="allow-scripts"></iframe>
  <script>
    const id = location.pathname.split('/').pop();
    document.getElementById('title').textContent = 'Loading...';

    fetch('/api/artifacts/' + id)
      .then(r => r.json())
      .then(a => { document.getElementById('title').textContent = a.title; })
      .catch(() => {});

    // Load rendered HTML as srcdoc so the iframe has a unique origin — prevents
    // malicious artifact code from accessing the parent page (no allow-same-origin).
    fetch('/api/render/' + id)
      .then(r => r.text())
      .then(html => {
        document.getElementById('viewer').srcdoc = html;
        document.getElementById('raw-link').href = 'data:text/html,' + encodeURIComponent(html);
      })
      .catch(err => {
        document.getElementById('title').textContent = 'Failed to load';
      });
  </script>
</body>
</html>
